function go(n){step=n;render()};document.querySelector('#home').onclick=()=>go(0);
const primary=(label,id)=>`<button class="primary" id="${id}">${label}</button>`;
function prompt(){return `CONTEXTO MESTRE DA EMPRESA\n\nVocê é um parceiro estratégico da ${A.company||'empresa'}. Use o contexto abaixo como fonte principal antes de recomendar qualquer ação. Não invente informações ausentes; sinalize hipóteses.\n\nResponsável: ${L.name||'Não informado'}\nSegmento: ${A.segment||'Não informado'}\nOferta: ${A.offer||'Não informado'}\nTicket médio declarado: ${A.ticket||'Não informado'}\nCliente: ${A.client||'Não informado'}\nProblema resolvido: ${A.problem||'Não informado'}\nDiferencial: ${A.difference||'Não informado'}\nAquisição: ${A.acquisition||'Não informado'}\nLeads mensais declarados: ${A.monthlyLeads||'Não informado'}\nConversão declarada: ${A.conversion||'Não informado'}\nInvestimento disponível: ${A.mediaBudget||'Não informado'}\nProcesso comercial: ${A.sales||'Não informado'}\nGargalo: ${A.bottleneck||'Não informado'}\nObjetivo: ${A.goal||'Não informado'}\nPrioridade: ${A.readiness||'Não informado'}\n\nAo responder: conecte recomendações ao objetivo; diferencie fatos, hipóteses e lacunas; proponha o próximo experimento e como medir aprendizado.`}
function promptPack(){const c=prompt();return[
{tag:'PROMPT 01 · CONTEXTO',title:'Pronto para uma IA entender sua empresa',desc:'Transforma qualquer IA em uma parceira que conhece o negócio.',text:c},
{tag:'PROMPT 02 · CRESCIMENTO',title:'Estratégia para conquistar os próximos 100 clientes',desc:'Cria uma rota simples de aquisição ligada à meta da empresa.',text:`${c}\n\nMISSÃO ESPECÍFICA\nCrie uma estratégia realista para a ${A.company} conquistar seus próximos 100 clientes ou usuários. Comece pelo funil mais simples capaz de gerar aprendizado rápido.\n\nEntregue: 1) perfil prioritário de comprador; 2) promessa e oferta de entrada; 3) canais de aquisição em ordem de prioridade; 4) funil direto com remarketing; 5) plano de 30 dias dividido por semana; 6) metas de volume e conversão; 7) três experimentos de baixo custo; 8) riscos, premissas e sinais para decidir se devemos ampliar o investimento. Não invente taxas históricas da empresa.`},
{tag:'PROMPT 03 · MARKETING',title:'Plano de marketing que gera demanda qualificada',desc:'Converte posicionamento em mensagens, conteúdo e campanhas.',text:`${c}\n\nMISSÃO ESPECÍFICA\nMonte um plano de marketing para atrair empresas ou pessoas com maior probabilidade de comprar a oferta da ${A.company}.\n\nEntregue: 1) tese central de posicionamento; 2) quatro ângulos de campanha realmente diferentes; 3) mensagem para o público que já procura uma solução; 4) ideias de conteúdo para consciência, desejo e decisão; 5) três anúncios com conceito visual, gancho, copy e CTA; 6) estrutura da landing page; 7) remarketing; 8) métricas por etapa. Conecte tudo ao objetivo “${A.goal||'definido no contexto'}”.`},
{tag:'PROMPT 04 · OPERAÇÃO',title:'Plano para organizar operação, dados e tecnologia',desc:'Traduz o diagnóstico em processos e automações prioritárias.',text:`${c}\n\nMISSÃO ESPECÍFICA\nCrie um plano enxuto para organizar a operação da ${A.company} e usar tecnologia sem adicionar complexidade desnecessária.\n\nEntregue: 1) mapa do processo atual; 2) gargalos e perdas de informação; 3) rotina mínima de gestão; 4) indicadores essenciais; 5) ferramentas que devem ser conectadas; 6) automações simples; 7) oportunidades reais de IA; 8) roadmap de 30, 60 e 90 dias. Separe o que deve ser feito agora, depois e o que não vale fazer neste momento.`}
]}
function render(){nav();const S=document.querySelector('#stage');S.scrollTop=0;if(step===0){S.innerHTML=`<div class="lead-gate"><div class="lead-copy"><div class="eye">NEX CONTEXT AGENT</div><h1>Sua empresa precisa ser compreendida.</h1><p>Organize o contexto do negócio, receba uma hipótese diagnóstica e simule caminhos de aquisição sem números inventados.</p><div class="glass note"><strong>RESULTADO INDIVIDUAL</strong><span>Cada resposta altera a leitura, as prioridades, os prompts e a projeção.</span><small>Leva cerca de 8 minutos. Você pode continuar depois.</small></div></div><form class="glass lead-form" id="leadForm"><div class="eye">ANTES DE COMEÇAR</div><h2>Onde enviamos seu contexto?</h2><div class="field"><label for="leadName">Seu nome</label><input id="leadName" autocomplete="name" value="${e(L.name||'')}" placeholder="Como podemos chamar você?"></div><div class="field-row"><div class="field"><label for="leadEmail">E-mail *</label><input id="leadEmail" type="email" autocomplete="email" value="${e(L.email||'')}" placeholder="voce@empresa.com"></div><div class="field"><label for="leadPhone">WhatsApp *</label><input id="leadPhone" type="tel" inputmode="tel" autocomplete="tel" value="${e(L.phone||'')}" placeholder="(11) 99999-9999"></div></div><div class="lead-error" id="leadError"></div><button class="primary" type="submit">${identified()&&Object.keys(A).length?'Continuar diagnóstico':'Iniciar diagnóstico'} ↗</button><span class="consent">Ao continuar, você permite que a NEX use essas informações para gerar e acompanhar este diagnóstico. Seus dados ficam salvos neste dispositivo até a integração definitiva.</span>${done()?'<button class="secondary" type="button" id="open">Ver meu resultado</button>':''}</form></div>`;const form=document.querySelector('#leadForm');form.onsubmit=ev=>{ev.preventDefault();L={name:document.querySelector('#leadName').value.trim(),email:document.querySelector('#leadEmail').value.trim(),phone:document.querySelector('#leadPhone').value.trim()};if(!identified()){document.querySelector('#leadError').textContent='Preencha um e-mail válido e um WhatsApp com DDD.';return}save();window.dispatchEvent(new CustomEvent('nex:lead-captured',{detail:payload()}));go(1)};if(document.querySelector('#open'))document.querySelector('#open').onclick=()=>go(4)}else if(step===1)question(S);else if(step===2)map(S);else if(step===3)diag(S);else if(step===4)deliver(S);else plan(S);requestAnimationFrame(()=>S.scrollTop=0)}
function question(S){const q=Q[qi];S.innerHTML=`<div class="flow"><div class="glass chat"><div class="qmeta"><div class="eye">PERGUNTA ${qi+1} DE ${Q.length}</div><button class="link" id="reset">Recomeçar</button></div><h2>${q[1]}</h2><p class="hint">${q[2]}</p><div class="history">${Object.values(A).slice(-2).map(v=>`<div class="bubble"><small>RESPOSTA SALVA</small><p>${e(v)}</p></div>`).join('')}</div>${q[3]?`<div class="options">${q[3].map(o=>`<button data-opt="${o}">${o}</button>`).join('')}</div>`:`<div class="composer"><textarea id="answer" rows="3" placeholder="Responda do seu jeito…"></textarea><button id="send" disabled>Salvar e continuar</button></div>`}</div><aside class="glass live"><div class="eye">CONTEXTO AO VIVO</div><div class="score"><strong>${Math.round(Object.keys(A).length/Q.length*100)}%</strong><span>estruturado</span></div>${[['Empresa',A.company],['Oferta',A.offer],['Cliente',A.client],['Gargalo',A.bottleneck]].map(x=>`<div class="fact"><small>${x[0]}</small><b>${e(x[1]||'Ainda não respondido')}</b></div>`).join('')}</aside></div>`;document.querySelector('#reset').onclick=()=>{localStorage.removeItem('nex-context-v2');A={};qi=0;render()};if(q[3])document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>submit(b.dataset.opt));else{const ta=document.querySelector('#answer'),btn=document.querySelector('#send');ta.oninput=()=>btn.disabled=!ta.value.trim();ta.onkeydown=x=>{if(x.key==='Enter'&&!x.shiftKey){x.preventDefault();submit(ta.value)}};btn.onclick=()=>submit(ta.value);ta.focus()}}
function submit(v){if(!v||!v.trim())return;A[Q[qi][0]]=v.trim();if(qi<Q.length-1)qi++;else step=2;save();render()}
function map(S){S.innerHTML=`<div class="base-layout"><div class="glass base-main"><div class="eye">BASE INICIAL · ${e(A.company)}</div><h2>Um primeiro contexto organizado para investigar melhor.</h2><p>As 12 respostas não substituem uma auditoria. Elas organizam o que você declarou e criam uma base para levantar hipóteses, enxergar lacunas e fazer as próximas perguntas certas.</p><div class="base-status"><span>12 respostas organizadas</span><span>Contexto declarado</span><span>Hipóteses ainda serão validadas</span></div><div class="known-grid"><article><small>OFERTA ATUAL</small><b>${e(A.offer)}</b></article><article><small>CLIENTE PERCEBIDO</small><b>${e(A.client)}</b></article><article><small>AQUISIÇÃO ATUAL</small><b>${e(A.acquisition)}</b></article><article><small>PROCESSO COMERCIAL</small><b>${e(A.sales)}</b></article></div></div><aside class="glass base-side"><small>SINAL MAIS IMPORTANTE</small><h3>Gargalo declarado</h3><p>${e(A.bottleneck)}</p><div class="callout"><small>OBJETIVO INFORMADO</small><b>${e(A.goal)}</b></div><span class="badge-initial">BASE PARA DIAGNÓSTICO · NÃO É AUDITORIA</span>${primary('Analisar o contexto','diag')}</aside></div>`;document.querySelector('#diag').onclick=()=>go(3)}
function diag(S){let p=A.readiness||'Organizar a operação',d=p==='Atrair mais clientes'?'O valor pode existir, mas ainda precisa ser traduzido em uma mensagem e um caminho de aquisição previsíveis.':p==='Converter melhor'?'Existe interesse, mas o processo comercial pode depender demais de conversas soltas e pouco acompanhamento.':p==='Usar melhor dados e tecnologia'?'A empresa opera, mas pode perder aprendizado porque informações, ferramentas e decisões ainda não estão conectadas.':'A operação pode ter crescido sem a mesma evolução de processos, responsabilidades e indicadores.',next=p==='Atrair mais clientes'?'Testar uma oferta e uma mensagem em um funil direto.':p==='Converter melhor'?'Mapear etapas, objeções e follow-ups de dez oportunidades.':p==='Usar melhor dados e tecnologia'?'Definir uma fonte única para leads, vendas e decisões.':'Mapear um processo crítico do início ao fim e seus responsáveis.',budget=({"Até R$ 1.000":800,"R$ 1.000 a R$ 3.000":2000,"R$ 3.000 a R$ 7.000":5000,"Acima de R$ 7.000":9000}[A.mediaBudget]||2000);S.innerHTML=`<div class="diagnosis-v2"><div class="glass hypothesis"><div class="eye">DIAGNÓSTICO INICIAL · ${e(A.company)}</div><span class="badge-initial">HIPÓTESE BASEADA EM ${Q.length} RESPOSTAS</span><h2>${e(p)}</h2><p>${d}</p><div class="result-strip"><span><small>PRIORIDADE</small><b>${e(p)}</b></span><span><small>META DECLARADA</small><b>${e(A.goal)}</b></span><span><small>PRIMEIRO TESTE</small><b>${e(next)}</b></span></div><div class="callout"><small>LEITURA CENTRAL</small><b>Antes de ampliar investimento, precisamos validar onde “${e(A.bottleneck)}” afeta a jornada e quanto isso distancia a empresa da meta.</b></div></div><div class="diag-stack"><div class="glass evidence-card"><div class="eye">EVIDÊNCIAS DECLARADAS</div><div class="evidence-list"><article><small>AQUISIÇÃO</small><b>“${e(A.acquisition)}”</b></article><article><small>LEADS / CONVERSÃO</small><b>“${e(A.monthlyLeads)}” · “${e(A.conversion)}”</b></article><article><small>CAPACIDADE DE INVESTIMENTO</small><b>“${e(A.mediaBudget)}”</b></article></div></div><div class="glass validation-card"><div class="eye">VALIDAR ANTES DE ESCALAR</div><div class="validation-list"><article><i>01</i><b>Custo real por clique e por oportunidade no mercado.</b></article><article><i>02</i><b>Conversão da página e qualidade dos contatos.</b></article><article><i>03</i><b>Ticket, margem e capacidade comercial para atender a demanda.</b></article></div></div></div></div><div class="glass projection"><div class="projection-head"><div><div class="eye">SIMULADOR DE AQUISIÇÃO</div><h3>Quanto o tráfego pode produzir?</h3></div><span class="badge-initial">CENÁRIO · NÃO É PROMESSA</span></div><div class="assumptions"><label>Investimento: <b id="bv">R$ ${budget.toLocaleString('pt-BR')}</b><input id="budget" type="range" min="500" max="15000" step="250" value="${budget}"></label><label>Custo por clique: <b id="cv">R$ 3,50</b><input id="cpc" type="range" min="1" max="15" step=".5" value="3.5"></label><label>Página → lead: <b id="lv">8%</b><input id="landing" type="range" min="1" max="30" step="1" value="8"></label><label>Lead → venda: <b id="sv">15%</b><input id="closing" type="range" min="1" max="50" step="1" value="15"></label></div><div class="projection-grid"><article><small>CLIQUES</small><strong id="clicks">—</strong></article><article><small>LEADS</small><strong id="leads">—</strong></article><article><small>VENDAS</small><strong id="salesOut">—</strong></article><article><small>CAC ESTIMADO</small><strong id="cac">—</strong></article></div><p class="projection-note">Ajuste as premissas com dados reais. A ferramenta calcula relações matemáticas; ela não afirma desempenho futuro.</p><div class="eye">TRÊS IDEIAS PARA O PRIMEIRO CICLO</div><div class="idea-grid"><article><small>01 · DIRETO</small><b>Oferta para intenção alta</b><span>Anúncio e landing focados em quem já procura resolver “${e(A.problem)}”.</span></article><article><small>02 · PROVA</small><b>Reduzir a incerteza</b><span>Transformar “${e(A.difference)}” em evidência visual, processo e argumento comercial.</span></article><article><small>03 · RETORNO</small><b>Remarketing simples</b><span>Reimpactar visitantes e leads que demonstraram interesse, mas ainda não decidiram.</span></article></div><br>${primary('Gerar entregáveis','gen')}</div>`;const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}),update=()=>{const b=+document.querySelector('#budget').value,c=+document.querySelector('#cpc').value,l=+document.querySelector('#landing').value,s=+document.querySelector('#closing').value,clicks=Math.floor(b/c),leads=Math.floor(clicks*l/100),sales=Math.max(0,Math.floor(leads*s/100));document.querySelector('#bv').textContent=money(b);document.querySelector('#cv').textContent='R$ '+c.toFixed(2).replace('.',',');document.querySelector('#lv').textContent=l+'%';document.querySelector('#sv').textContent=s+'%';document.querySelector('#clicks').textContent=clicks.toLocaleString('pt-BR');document.querySelector('#leads').textContent=leads.toLocaleString('pt-BR');document.querySelector('#salesOut').textContent=sales.toLocaleString('pt-BR');document.querySelector('#cac').textContent=sales?money(b/sales):'Sem base';};document.querySelectorAll('.assumptions input').forEach(x=>x.oninput=update);update();document.querySelector('#gen').onclick=()=>go(4)}
function deliver(S){const P=promptPack(),outcomes=['Contexto mestre para IA','Plano para 100 clientes','Plano de marketing','Roadmap operacional'];let active=0;S.innerHTML=`<div class="prompt-hub"><div class="prompt-head"><div class="eye">CENTRAL DE PROMPTS · ${e(A.company)}</div><h2>Da base inicial para uma ação concreta.</h2><p>Os prompts abaixo combinam as respostas declaradas com instruções estratégicas. Eles não substituem pesquisa ou auditoria, mas aceleram um primeiro plano com contexto real.</p></div><div class="prompt-layout"><div class="prompt-list">${P.map((p,i)=>`<button class="prompt-card ${i===0?'on':''}" data-prompt="${i}"><i>0${i+1}</i><span><b>${p.title}</b><span>${p.desc}</span></span></button>`).join('')}</div><div class="glass prompt-view"><small id="ptag">${P[0].tag}</small><h3 id="ptitle">${P[0].title}</h3><div class="prompt-value"><span><b>Base usada</b>12 respostas organizadas</span><span><b>Resultado esperado</b><em id="presult">${outcomes[0]}</em></span><span><b>Nível</b>Primeira versão para validar</span></div><small>PRÉVIA DO PROMPT PERSONALIZADO</small><div class="prompt-text" id="ptext">${e(P[0].text)}</div><div class="actions"><button class="primary" id="copy">Copiar este prompt</button><button class="secondary" id="download">Baixar os 4 prompts</button></div></div></div><div class="glass prompt-footer"><div><small>PRÓXIMO PASSO</small><b>Validar a hipótese com dados reais e transformar o resultado em execução.</b></div>${primary('Criar plano inicial','plan')}</div></div>`;const show=i=>{active=i;document.querySelectorAll('[data-prompt]').forEach((b,n)=>b.classList.toggle('on',n===i));document.querySelector('#ptag').textContent=P[i].tag;document.querySelector('#ptitle').textContent=P[i].title;document.querySelector('#presult').textContent=outcomes[i];document.querySelector('#ptext').textContent=P[i].text;document.querySelector('#copy').textContent='Copiar este prompt'};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>show(+b.dataset.prompt));document.querySelector('#copy').onclick=async x=>{try{await navigator.clipboard.writeText(P[active].text)}catch{const t=document.createElement('textarea');t.value=P[active].text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}x.target.textContent='Prompt copiado'};document.querySelector('#download').onclick=()=>{const content=P.map(p=>`${p.tag}\n${p.title}\n\n${p.text}`).join('\n\n────────────────────────\n\n'),u=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='prompts-nex-'+(A.company||'empresa').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.txt';a.click();URL.revokeObjectURL(u)};document.querySelector('#plan').onclick=()=>go(5)}
function plan(S){const phases=[{tag:'01 · CLAREZA',title:'Definir a hipótese central',summary:`Transformar “${A.bottleneck}” em uma pergunta que possa ser comprovada.`,focus:`Se corrigirmos “${A.bottleneck}”, avançaremos em direção a “${A.goal}”?`,action:'Reunir evidências do processo atual e conversar com clientes ou oportunidades reais antes de escolher a solução.',proof:'Uma hipótese escrita, três evidências e uma métrica de partida.',next:'Ver execução →'},{tag:'02 · EXECUÇÃO',title:'Rodar um experimento pequeno',summary:`Testar uma ação ligada à prioridade “${A.readiness}”.`,focus:`Qual é a menor ação capaz de gerar um sinal real em até 14 dias?`,action:'Escolher uma oferta, um público, um canal e uma chamada para ação. Não abrir outras frentes durante o teste.',proof:'Experimento publicado, volume registrado e respostas organizadas.',next:'Ver aprendizado →'},{tag:'03 · APRENDIZADO',title:'Decidir com o que aconteceu',summary:'Comparar expectativa, resposta real e próximo ajuste antes de ampliar investimento.',focus:'O sinal obtido confirma, enfraquece ou muda a hipótese inicial?',action:'Registrar o que foi feito, quantas pessoas responderam, onde pararam e qual objeção apareceu com mais frequência.',proof:'Uma decisão clara: manter, ajustar ou interromper — acompanhada da evidência.',next:'Recomeçar ciclo ↻'}];let active=0;S.innerHTML=`<div class="glass plan"><div class="eye">PRIMEIRO CICLO · 30 DIAS</div><h2>Agora existe um próximo passo.</h2><p>Selecione cada etapa para ver como transformar a base inicial em aprendizado real.</p><div class="plan-grid">${phases.map((p,i)=>`<button class="phase-card ${i===0?'on':''}" data-phase="${i}"><small>${p.tag}</small><b>${p.title}</b><span>${e(p.summary)}</span></button>`).join('')}</div><div class="phase-detail"><div class="phase-focus"><small id="phase-tag">${phases[0].tag}</small><h3 id="phase-title">${phases[0].title}</h3><p id="phase-focus">${e(phases[0].focus)}</p></div><div class="phase-info"><small>AÇÃO DESTA ETAPA</small><b id="phase-action">${e(phases[0].action)}</b></div><div class="phase-info"><small>CRITÉRIO DE CONCLUSÃO</small><b id="phase-proof">${e(phases[0].proof)}</b></div></div><div class="phase-nav"><span>Clique nos cards para navegar pelo ciclo.</span><button class="phase-next" id="phase-next">${phases[0].next}</button></div><div class="final"><div><small>SEU CONTEXTO CONTINUA VIVO</small><b>Volte e atualize quando a empresa mudar.</b></div><div class="actions"><button class="secondary" id="update">Atualizar contexto</button><a class="primary" target="_blank" href="https://wa.me/55?text=${encodeURIComponent('Oi, concluí meu Contexto NEX da empresa '+A.company+' e quero conversar sobre o diagnóstico.')}">Agendar análise</a></div></div></div>`;const show=i=>{active=i;const p=phases[i];document.querySelectorAll('[data-phase]').forEach((b,n)=>b.classList.toggle('on',n===i));document.querySelector('#phase-tag').textContent=p.tag;document.querySelector('#phase-title').textContent=p.title;document.querySelector('#phase-focus').textContent=p.focus;document.querySelector('#phase-action').textContent=p.action;document.querySelector('#phase-proof').textContent=p.proof;document.querySelector('#phase-next').textContent=p.next};document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>show(+b.dataset.phase));document.querySelector('#phase-next').onclick=()=>show((active+1)%phases.length);document.querySelector('#update').onclick=()=>go(1)}render();
</script></body></html>
